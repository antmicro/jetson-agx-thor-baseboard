stages:
  - build
  - deploy

build:
  stage: build
  image: $CI_DOCS_DOCKER_IMAGE
  before_get_sources:
    - apt-get update
    - apt-get install python3-venv python3-pip python3 -y
  before_script:
    - python3 -m venv .venv/
    - source .venv/bin/activate
    - pip3 install -r requirements.txt
  script:
    - source .venv/bin/activate
    - make html latexpdf
    - cp build/latex/*.pdf build/html/
    - tar cf $CI_DOCS_ARCHIVE -C build/html/ .
  artifacts:
    paths:
      - build
      - $CI_DOCS_ARCHIVE

deploy:
  variables:
    GIT_STRATEGY: none
  dependencies:
    - build
  stage: deploy
  image: debian:trixie
  tags: ['docs']
  script: echo 'Deploying docs'
  artifacts:
    paths:
      - $CI_DOCS_ARCHIVE
